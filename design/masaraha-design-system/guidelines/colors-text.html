<!-- @dsCard group="Colors" viewport="700x160" name="Text on ground" subtitle="Three levels, plus on-accent pairs" -->
<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--ground);font:var(--type-body-sm);color:var(--text-2)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:var(--radius-sm);border:1px solid var(--line);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;height:88px}.sw b{font:var(--type-caption);color:inherit}.sw code{font:var(--type-micro);font-family:var(--font-mono);opacity:.75}</style>
</head><body>
<div style="display:flex;flex-direction:column;gap:8px"><div style="font:var(--type-subtitle);color:var(--text-1)">النص الأساسي — <code style="font:var(--type-micro);font-family:var(--font-mono)">--text-1 #F5EFE9</code></div><div style="font:var(--type-body);color:var(--text-2)">النص الثانوي والتسميات — <code style="font:var(--type-micro);font-family:var(--font-mono)">--text-2</code></div><div style="font:var(--type-body-sm);color:var(--text-3)">الباهت: الساعة، المعطّل، الـ placeholder — <code style="font:var(--type-micro);font-family:var(--font-mono)">--text-3</code></div><div class="row" style="margin-top:4px"><span style="background:var(--citron-500);color:var(--text-on-accent);padding:8px 14px;border-radius:var(--radius-pill);font:var(--type-caption)">على الليموني · --text-on-accent</span><span style="background:var(--rose-500);color:var(--text-on-reveal);padding:8px 14px;border-radius:var(--radius-pill);font:var(--type-caption)">على الوردي · --text-on-reveal</span></div></div>
</body></html>
