<!-- @dsCard group="Motion" viewport="700x160" name="Duration & easing" subtitle="Calm, no bounce — the reveal is the only slow move" -->
<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--ground);font:var(--type-body-sm);color:var(--text-2)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:var(--radius-sm);border:1px solid var(--line);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;height:88px}.sw b{font:var(--type-caption);color:inherit}.sw code{font:var(--type-micro);font-family:var(--font-mono);opacity:.75}</style>
</head><body>
<div style="display:flex;flex-direction:column;gap:6px;font:var(--type-body-sm);color:var(--text-2)"><div><code style="font-family:var(--font-mono);color:var(--citron-300)">--dur-instant 90ms</code> — press feedback, scale .97</div><div><code style="font-family:var(--font-mono);color:var(--citron-300)">--dur-fast 150ms</code> — hover, colour, border</div><div><code style="font-family:var(--font-mono);color:var(--citron-300)">--dur-base 220ms</code> — toggle knob, sheet slide</div><div><code style="font-family:var(--font-mono);color:var(--rose-300)">--dur-reveal 900ms</code> — the identity fade-up, once</div><div style="font:var(--type-micro);color:var(--text-3)">ease-out cubic-bezier(.22,.61,.36,1) · no bounce, no spring, anywhere</div></div>
</body></html>
