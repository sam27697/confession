<!-- @dsCard group="Colors" viewport="700x150" name="Semantic states" subtitle="Danger, pending, hidden — plus their washes" -->
<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--ground);font:var(--type-body-sm);color:var(--text-2)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:var(--radius-sm);border:1px solid var(--line);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;height:88px}.sw b{font:var(--type-caption);color:inherit}.sw code{font:var(--type-micro);font-family:var(--font-mono);opacity:.75}</style>
</head><body>
<div class="row"><div class="sw" style="background:var(--danger-500);color:#1B0704"><b>خطر</b><code>--danger-500</code></div><div class="sw" style="background:var(--danger-wash);color:#FFC9C1"><b>wash</b><code>--danger-wash</code></div><div class="sw" style="background:var(--pending-500);color:#241703"><b>منتظر</b><code>--pending-500</code></div><div class="sw" style="background:var(--pending-wash);color:#F7DCA9"><b>wash</b><code>--pending-wash</code></div><div class="sw" style="background:var(--hidden-500);color:#16100F"><b>مخبّاة</b><code>--hidden-500</code></div><div class="sw" style="background:var(--hidden-wash);color:var(--text-2)"><b>wash</b><code>--hidden-wash</code></div></div>
</body></html>
