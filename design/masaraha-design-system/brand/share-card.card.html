<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--ground-deep)}
.og{width:1200px;height:630px;position:relative;overflow:hidden;background-color:var(--ground);background-image:radial-gradient(90% 70% at 50% -18%,rgba(214,242,91,.16) 0%,rgba(214,242,91,0) 60%),linear-gradient(180deg,#1B1412 0%,#100B0A 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:0 120px;box-sizing:border-box}
.mark{width:132px;height:132px;border-radius:38px 38px 11px 38px;background:var(--citron-500);color:var(--text-on-accent);display:grid;place-items:center;font-family:var(--font-ar);font-weight:800;font-size:72px;line-height:1;box-shadow:0 30px 80px -30px var(--citron-glow)}
h1{font-family:var(--font-ar);font-weight:800;font-size:104px;line-height:1.15;color:var(--text-1);text-align:center}
p{font-family:var(--font-ar);font-weight:500;font-size:40px;line-height:1.5;color:var(--text-2);text-align:center;max-width:20ch}
.url{font-family:var(--font-mono);font-size:26px;letter-spacing:.02em;color:var(--citron-500);direction:ltr;position:absolute;bottom:44px}
</style></head><body>
<div class="og">
<div class="mark">م</div>
<h1>صارِح سامر</h1>
<p>ابعتلو اللي بقلبك وهو ما بيعرف مين إنت.</p>
<div class="url">confession.fayad.app</div>
</div>
</body></html>
