<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:18px;background:var(--ground)}.g{display:grid;grid-template-columns:1fr 1fr;gap:18px}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { TextField, TextArea, CheckboxRow } = window.MasarahaDesignSystem_b05309
function Sheet(){
  const [q,setQ]=React.useState('شو يلي خلاك تبعتلي هالرسالة هلق بالذات؟')
  const [b,setB]=React.useState('')
  const [age,setAge]=React.useState(true)
  const [tr,setTr]=React.useState(false)
  return <div className="g">
    <div style={{display:'flex',flexDirection:'column',gap:'14px'}}>
      <TextField id="q" label="شو بدك تسأله؟" value={q} onChange={setQ} maxLength={500} counter />
      <TextField id="e" label="سبب البلاغ" value="" onChange={()=>{}} error="لازم تكتب شي مش أقل من حرفين." />
      <CheckboxRow id="a" strong checked={age} onChange={setAge}>عمري ١٨ سنة أو أكثر</CheckboxRow>
      <CheckboxRow id="t" checked={tr} onChange={setTr}>موافق على الشروط والأحكام</CheckboxRow>
    </div>
    <TextArea id="b" hero rows={6} value={b} onChange={setB} placeholder="اكتب اللي بقلبك…" maxLength={4000} />
  </div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<Sheet/>)
</script></body></html>
