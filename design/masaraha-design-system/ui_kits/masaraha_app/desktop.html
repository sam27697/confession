<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>مصارحة — سطح المكتب</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--ground)}main{max-width:var(--content-max);margin:0 auto;padding:32px var(--gutter-desktop) 80px;display:flex;flex-direction:column;gap:var(--space-4)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:100vh}
.col{border-inline-start:1px solid var(--line);position:relative}
.tag{position:absolute;top:12px;inset-inline-start:16px;font:var(--type-micro);color:var(--text-3);z-index:9}
</style></head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="ScreensAuth.jsx"></script>
<script type="text/babel" src="ScreensInbox.jsx"></script>
<script type="text/babel" src="ScreensSend.jsx"></script>
<script type="text/babel" src="ScreensReveal.jsx"></script>
<script type="text/babel">
function Desktop(){
  const [enabled,setEnabled]=React.useState(true)
  return <div className="two">
    <div className="col" style={{background:'var(--ground)'}}>
      <span className="tag">/inbox</span>
      <AppHeader active="inbox" />
      <main><Inbox enabled={enabled} onToggle={setEnabled} /></main>
    </div>
    <div className="col" style={{backgroundColor:'var(--ground)',backgroundImage:'var(--veil-citron)',backgroundRepeat:'no-repeat'}}>
      <span className="tag">/c/k7m2xq9had4v</span>
      <AppHeader signedIn={false} />
      <main><SendPage /></main>
    </div>
  </div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<Desktop/>)
</script></body></html>
